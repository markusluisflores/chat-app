name: E2E

on:
  deployment_status: {}

permissions:
  contents: read

jobs:
  e2e:
    name: Playwright smoke tests
    if: >-
      github.event.deployment_status.state == 'success' &&
      !contains(github.event.deployment_status.environment, 'production')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: 'npm'

      - name: Resolve environment name and BASE_URL
        id: url
        run: |
          FULL_ENV="${{ github.event.deployment_status.environment }}"
          ENV_NAME="${FULL_ENV##* / }"
          BASE_URL="https://chat-app-${ENV_NAME}.up.railway.app"
          echo "environment: $FULL_ENV"
          echo "env_name:    $ENV_NAME"
          echo "base_url:    $BASE_URL"
          echo "env_name=$ENV_NAME" >> "$GITHUB_OUTPUT"
          echo "base_url=$BASE_URL" >> "$GITHUB_OUTPUT"

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Set staging Supabase vars on Railway PR environment
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          STAGING_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
          STAGING_SUPABASE_ANON_KEY: ${{ secrets.STAGING_SUPABASE_ANON_KEY }}
          STAGING_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.STAGING_SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          ENV="${{ steps.url.outputs.env_name }}"
          PROJECT="ae127dfc-f0d3-4e7d-ad87-759b1c27ac67"

          railway variables set \
            "NEXT_PUBLIC_SUPABASE_URL=${STAGING_SUPABASE_URL}" \
            "NEXT_PUBLIC_SUPABASE_ANON_KEY=${STAGING_SUPABASE_ANON_KEY}" \
            --service chat-app --environment "$ENV" --project "$PROJECT"

          railway variables set \
            "NEXT_PUBLIC_SUPABASE_URL=${STAGING_SUPABASE_URL}" \
            "SUPABASE_SERVICE_ROLE_KEY=${STAGING_SUPABASE_SERVICE_ROLE_KEY}" \
            "RAILWAY_DOCKERFILE_PATH=Dockerfile.worker" \
            --service worker --environment "$ENV" --project "$PROJECT"

      - name: Point staging Supabase webhook at this PR environment
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          STAGING_SUPABASE_PROJECT_REF: ${{ secrets.STAGING_SUPABASE_PROJECT_REF }}
          STAGING_SUPABASE_WEBHOOK_SECRET: ${{ secrets.STAGING_SUPABASE_WEBHOOK_SECRET }}
          BASE_URL: ${{ steps.url.outputs.base_url }}
        run: |
          python3 << 'EOF'
          import os, json, urllib.request

          base_url = os.environ['BASE_URL']
          secret = os.environ['STAGING_SUPABASE_WEBHOOK_SECRET']
          token = os.environ['SUPABASE_ACCESS_TOKEN']
          ref = os.environ['STAGING_SUPABASE_PROJECT_REF']

          sql = f"""
          CREATE OR REPLACE FUNCTION handle_message_insert_webhook()
          RETURNS trigger LANGUAGE plpgsql SECURITY DEFINER AS $func$
          begin
            perform net.http_post(
              url := '{base_url}/api/webhooks/message-insert',
              body := jsonb_build_object(
                'type', 'INSERT', 'table', 'messages', 'schema', 'public',
                'record', row_to_json(NEW)::jsonb
              ),
              headers := jsonb_build_object(
                'Content-Type', 'application/json',
                'x-webhook-secret', '{secret}'
              )
            );
            return NEW;
          end;
          $func$;
          """

          req = urllib.request.Request(
              f'https://api.supabase.com/v1/projects/{ref}/database/query',
              data=json.dumps({'query': sql}).encode(),
              headers={
                  'Authorization': f'Bearer {token}',
                  'Content-Type': 'application/json'
              }
          )
          resp = urllib.request.urlopen(req)
          print('Webhook updated:', resp.read().decode())
          EOF

      - name: Wait for Railway redeployment
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          ENV="${{ steps.url.outputs.env_name }}"
          PROJECT="ae127dfc-f0d3-4e7d-ad87-759b1c27ac67"

          railway link --project "$PROJECT" --environment "$ENV" --service chat-app

          echo "Polling for chat-app redeployment..."
          sleep 10
          for i in $(seq 1 24); do
            STATUS=$(railway deployment list --service chat-app --limit 1 --json 2>/dev/null \
              | python3 -c "import json,sys; d=json.load(sys.stdin); print(d[0]['status'] if d else 'UNKNOWN')" 2>/dev/null \
              || echo "UNKNOWN")
            echo "Attempt $i: chat-app = $STATUS"
            [ "$STATUS" = "SUCCESS" ] && break
            [ "$STATUS" = "FAILED" ] && { echo "Redeployment failed"; exit 1; }
            sleep 15
          done

      - run: npm ci
      - run: npx playwright install chromium --with-deps
      - run: npx playwright test
        env:
          BASE_URL: ${{ steps.url.outputs.base_url }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.STAGING_SUPABASE_ANON_KEY }}

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: test-results/
          retention-days: 3
