name: E2E

on:
  deployment_status: {}
  workflow_dispatch:
    inputs:
      environment:
        description: 'Railway environment name (e.g. chat-app-pr-26)'
        required: true
      skip_var_set:
        description: 'Skip setting Railway vars (use when already set manually via Railway MCP)'
        required: false
        default: 'false'

permissions:
  contents: read

jobs:
  e2e:
    name: Playwright smoke tests
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.deployment_status.state == 'success' &&
      !contains(github.event.deployment_status.environment, 'production'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: 'npm'

      - name: Resolve environment name and BASE_URL
        id: url
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            ENV_NAME="${{ github.event.inputs.environment }}"
          else
            FULL_ENV="${{ github.event.deployment_status.environment }}"
            ENV_NAME="${FULL_ENV##* / }"
          fi
          BASE_URL="https://chat-app-${ENV_NAME}.up.railway.app"
          echo "env_name: $ENV_NAME"
          echo "base_url: $BASE_URL"
          echo "env_name=$ENV_NAME" >> "$GITHUB_OUTPUT"
          echo "base_url=$BASE_URL" >> "$GITHUB_OUTPUT"

      - name: Set staging Supabase vars on Railway PR environment
        # Skippable via skip_var_set=true when vars are already set (e.g. via Railway MCP).
        # Railway's Cloudflare applies a strict 10 RPS limit to requests without query params,
        # which triggers extended IP bans on shared GitHub Actions runner IPs. The ?queryName=
        # param opts into the standard 50 RPS limit instead. See Railway station thread on
        # Cloudflare rate limiting for context.
        if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.skip_var_set != 'true' }}
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          STAGING_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
          STAGING_SUPABASE_ANON_KEY: ${{ secrets.STAGING_SUPABASE_ANON_KEY }}
          STAGING_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.STAGING_SUPABASE_SERVICE_ROLE_KEY }}
          ENV_NAME: ${{ steps.url.outputs.env_name }}
        run: |
          python3 << 'EOF'
          import os, json, urllib.request, sys

          token = os.environ['RAILWAY_TOKEN']
          project_id = 'ae127dfc-f0d3-4e7d-ad87-759b1c27ac67'
          env_name = os.environ['ENV_NAME']

          def gql(op_name, query, variables=None):
              req = urllib.request.Request(
                  f'https://backboard.railway.app/graphql/v2?queryName={op_name}',
                  data=json.dumps({'query': query, 'variables': variables or {}}).encode(),
                  headers={
                      'Authorization': f'Bearer {token}',
                      'Content-Type': 'application/json',
                  }
              )
              try:
                  resp = urllib.request.urlopen(req)
              except urllib.error.HTTPError as e:
                  print(f'HTTP {e.code} {e.reason}: {e.read().decode()}', file=sys.stderr)
                  sys.exit(1)
              data = json.loads(resp.read())
              if 'errors' in data:
                  print('GraphQL errors:', data['errors'], file=sys.stderr)
                  sys.exit(1)
              return data['data']

          info = gql('getProjectInfo', '''
          query($projectId: String!) {
            project(id: $projectId) {
              environments { edges { node { id name } } }
              services { edges { node { id name } } }
            }
          }
          ''', {'projectId': project_id})

          envs = {e['node']['name']: e['node']['id']
                  for e in info['project']['environments']['edges']}
          svcs = {s['node']['name']: s['node']['id']
                  for s in info['project']['services']['edges']}

          env_id = envs.get(env_name)
          if not env_id:
              print(f'Environment "{env_name}" not found. Available: {list(envs)}', file=sys.stderr)
              sys.exit(1)

          chat_id = svcs['chat-app']
          worker_id = svcs['worker']
          print(f'env_id={env_id}  chat_id={chat_id}  worker_id={worker_id}')

          upsert = '''
          mutation($input: VariableCollectionUpsertInput!) {
            variableCollectionUpsert(input: $input)
          }
          '''

          gql('setChatAppVars', upsert, {'input': {
              'projectId': project_id,
              'environmentId': env_id,
              'serviceId': chat_id,
              'variables': {
                  'NEXT_PUBLIC_SUPABASE_URL': os.environ['STAGING_SUPABASE_URL'],
                  'NEXT_PUBLIC_SUPABASE_ANON_KEY': os.environ['STAGING_SUPABASE_ANON_KEY'],
              },
          }})
          print('chat-app vars set')

          gql('setWorkerVars', upsert, {'input': {
              'projectId': project_id,
              'environmentId': env_id,
              'serviceId': worker_id,
              'variables': {
                  'NEXT_PUBLIC_SUPABASE_URL': os.environ['STAGING_SUPABASE_URL'],
                  'SUPABASE_SERVICE_ROLE_KEY': os.environ['STAGING_SUPABASE_SERVICE_ROLE_KEY'],
                  'RAILWAY_DOCKERFILE_PATH': 'Dockerfile.worker',
              },
          }})
          print('worker vars set')
          EOF

      - name: Point staging Supabase webhook at this PR environment
        # Uses psql (direct Postgres connection) instead of the Supabase Management API
        # (api.supabase.com) — the Management API is behind Cloudflare bot protection that
        # blocks Python urllib with error code 1010. psql bypasses this entirely.
        env:
          PGPASSWORD: ${{ secrets.STAGING_SUPABASE_DB_PASSWORD }}
          STAGING_SUPABASE_PROJECT_REF: ${{ secrets.STAGING_SUPABASE_PROJECT_REF }}
          STAGING_SUPABASE_WEBHOOK_SECRET: ${{ secrets.SUPABASE_WEBHOOK_SECRET }}
          BASE_URL: ${{ steps.url.outputs.base_url }}
        run: |
          cat > /tmp/update_webhook.sql << SQLEOF
          CREATE OR REPLACE FUNCTION handle_message_insert_webhook()
          RETURNS trigger LANGUAGE plpgsql SECURITY DEFINER AS \$func\$
          begin
            perform net.http_post(
              url := '${BASE_URL}/api/webhooks/message-insert',
              body := jsonb_build_object(
                'type', 'INSERT', 'table', 'messages', 'schema', 'public',
                'record', row_to_json(NEW)::jsonb
              ),
              headers := jsonb_build_object(
                'Content-Type', 'application/json',
                'x-webhook-secret', '${STAGING_SUPABASE_WEBHOOK_SECRET}'
              )
            );
            return NEW;
          end;
          \$func\$;
          SQLEOF

          # GitHub Actions runners can't route IPv6. psql/libpq tries AAAA first and
          # fails with "Network is unreachable". PGHOSTADDR forces an explicit IPv4
          # address while the original hostname is still used for SSL/SNI.
          PSQL_HOST="db.${STAGING_SUPABASE_PROJECT_REF}.supabase.co"
          IPV4=$(getent ahostsv4 "$PSQL_HOST" | awk '{print $1; exit}')
          echo "Connecting to $PSQL_HOST via $IPV4"

          PGHOSTADDR="$IPV4" psql "postgresql://postgres@${PSQL_HOST}:5432/postgres?sslmode=require" \
            -f /tmp/update_webhook.sql

      - name: Wait for Railway redeployment
        # Only needed when vars were just set — the var change triggers an automatic redeploy.
        if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.skip_var_set != 'true' }}
        run: sleep 180

      - run: npm ci
      - run: npx playwright install chromium --with-deps
      - run: npx playwright test
        env:
          BASE_URL: ${{ steps.url.outputs.base_url }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.STAGING_SUPABASE_ANON_KEY }}

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: test-results/
          retention-days: 3
